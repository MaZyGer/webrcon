<div ng-controller="ChatController" id="ChatController">
    <label>
        <input type="checkbox"
               ng-model="ShowServerMessages"
               ng-change="ApplyFilter()">
        Servernachrichten anzeigen
    </label>

    <select class="form-control" style="margin-bottom: 6px"
            ng-model="SelectedUser"
            ng-change="ApplyFilter()">

        <option value="">Alle Spieler</option>
        <option ng-repeat="user in Users" value="{{user}}">
            {{user}}
        </option>
    </select>
    <div style="height: 510px" class="Output scrollable">
    	<div ng-repeat="line in Output" ng-class="line.Class">
            <div ng-if="!line.IsServer" class="portlet portlet-default">
                <div id="chat" class="panel-collapse collapse in">
                    <div>
                    <div class="portlet-body chat-widget" style="width: auto;">
                        <div class="row" style="margin-right: 0px">
                            <div class="col-lg-12">
                                <div class="media">
                                    <a class="pull-left" href="#">
                                        <img class="media-object img-circle img-chat" ng-src="{{ line.Avatar ? line.Avatar : 'image/noimage.png' }}" alt="">
                                    </a>
                                    
                                    <div class="media-body">
                                        <h4 class="media-heading"> 
                                            <a href="#/{{address}}/player/{{line.UserId}}/">{{ line.Username }}</a> 
                                            <span class="small">{{(line.Time * 1000) | date:'[dd.MM.yyyy] HH:mm'}}</span>
                                        </h4>
                                        <p>{{line.Message}}</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                    </div>
                </div>
            </div>
    		
            <span ng-style="" ng-if="line.IsServer">
                <span style="min-width: 60px; display:inline-block;">{{(line.Time * 1000) | date:'[dd.MM.yyyy] HH:mm'}}</span>
                <span style="min-width: 130px; display:inline-block; text-align: right;">
                    <a href="#/{{address}}/player/{{line.UserId}}/" style="color: inherit;" ng-style="{ 'color': line.Username === 'Server' ? line.Color : 'inherit'}" >
                        {{ line.Username }}:
                    </a>
                </span>
                <span ng-style="{'color': line.Username === 'Server' ? line.Color : 'inherit'}"  style="display:inline-block;">
                    {{line.Message}}
                </span>
            </span>
    	</div>
    </div>

    <form ng-submit="SubmitCommand()" class="md-inline-form">

        <div style="margin-bottom: 6px;">
            <label>
                <input type="checkbox" ng-model="UseAdvancedMessage">
                Erweiterte Servernachricht
            </label>
        </div>

        <div ng-show="UseAdvancedMessage"
             style="display: flex; gap: 6px; margin-bottom: 6px;">

            <label style="margin: 0; white-space: nowrap;">
                Sendername:
            </label>
            
            <input type="text"
                   class="form-control"
                   ng-model="MessageSender"
                   placeholder="Sendername"
                   ng-keydown="$event.keyCode === 13 && $event.preventDefault()"
                   style="flex: 1;">

            <select class="form-control"
                    ng-model="MessageType"
                    ng-options="type.Id as type.Name for type in MessageTypes"
                    style="flex: 1;">
            </select>

        </div>

        <div>
            <input type="text"
                   class="form-control"
                   ng-model="Command"
                   placeholder="Nachricht..."
                   style="width: 100%">
        </div>

        <button type="submit" style="display: none;"></button>

    </form>

</div>
